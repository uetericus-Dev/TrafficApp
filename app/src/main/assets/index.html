<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mein Tram</title>
<style>
  :root {
    --bg: #0B1F3A; --panel: #12294A; --line: #1E3A63; --text: #FFFFFF;
    --muted: #9FB3CF; --accent: #FFD200; --red: #FF5A5A; --green: #3DDC84;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Helvetica Neue", Roboto, Arial, sans-serif; }
  body { padding: 18px 16px 28px; min-height: 100vh; }
  .hidden { display: none !important; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .clock { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .icon-btn { background: var(--panel); color: var(--text); border: 0; border-radius: 12px;
    width: 44px; height: 44px; font-size: 22px; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .tab { background: var(--panel); color: var(--muted); border: 2px solid transparent; border-radius: 14px;
    padding: 12px 8px; font-size: 16px; font-weight: 700; }
  .tab.active { color: var(--bg); background: var(--accent); }

  .route { color: var(--muted); font-size: 14px; margin: 0 2px 10px; }
  .route b { color: var(--text); font-weight: 600; }

  .hero { background: var(--panel); border-radius: 20px; padding: 18px; margin-bottom: 14px; }
  .hero .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hero .top .badge.sm { height: 38px; min-width: 46px; font-size: 20px; }
  .badge { min-width: 46px; height: 38px; padding: 0 10px; border-radius: 8px; background: #fff; color: var(--bg);
    font-weight: 800; font-size: 20px; display: inline-flex; align-items: center; justify-content: center; }
  .hero .dest { font-size: 17px; font-weight: 600; line-height: 1.2; }
  .hero .mins { font-size: 64px; font-weight: 800; margin-top: 10px; line-height: 1;
    font-variant-numeric: tabular-nums; }
  .hero .mins small { font-size: 22px; font-weight: 600; color: var(--muted); margin-left: 6px; }
  .hero .meta { color: var(--muted); margin-top: 8px; font-size: 15px; }
  .delay { color: var(--red); font-weight: 700; }
  .ontime { color: var(--green); }

  .list { background: var(--panel); border-radius: 16px; overflow: hidden; }
  .row { padding: 12px 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .rowmain { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
  .chain { display: flex; align-items: center; }
  .btns { display: flex; gap: 8px; }
  .badge.sm { height: 30px; min-width: 40px; font-size: 16px; padding: 0 8px; }
  .badge.train { background: #2D6CDF; color: #fff; }
  .chev { color: var(--muted); margin: 0 4px; font-size: 18px; }
  .delay.big { background: var(--red); color: #fff; border-radius: 6px; padding: 0 5px; }
  s.planned { color: var(--muted); font-weight: 400; font-size: .85em; }
  .muted { color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  .pill.green { background: rgba(61,220,132,.15); color: var(--green); }
  .pill.orange { background: rgba(255,170,0,.18); color: #FFB020; }
  .pill.red { background: rgba(255,90,90,.18); color: var(--red); }
  .more { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .legs { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .leg { margin: 8px 0; }
  .leghead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .leghead .badge { height: 28px; min-width: 38px; font-size: 15px; }
  .dir { font-size: 14px; font-weight: 600; }
  .stop { position: relative; padding-left: 22px; font-size: 14px; color: var(--text); margin: 4px 0; line-height: 1.4; }
  .stop b { font-variant-numeric: tabular-nums; }
  .dot { position: absolute; left: 4px; top: 5px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); }
  .dot.end { background: var(--accent); }
  .change { font-size: 13px; color: var(--accent); background: rgba(255,210,0,.08); border-radius: 10px;
    padding: 8px 10px; margin: 8px 0; }
  .change.bad { color: var(--red); background: rgba(255,90,90,.12); }
  .change.walk { color: var(--muted); background: transparent; padding: 2px 10px; }
  .row .info { font-size: 14px; color: var(--muted); }
  .row .info b { color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; }
  .row .in { font-size: 22px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  .row .in small { font-size: 13px; color: var(--muted); font-weight: 600; }

  .status { text-align: center; color: var(--muted); font-size: 13px; margin-top: 12px; }
  .msg { background: var(--panel); border-radius: 16px; padding: 22px; text-align: center; color: var(--muted); }

  /* Einstellungen */
  h2 { margin: 4px 0 18px; font-size: 22px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  .field { position: relative; }
  input[type=text] { width: 100%; font-size: 17px; padding: 14px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--panel); color: var(--text); outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  .sugg { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; background: #fff; color: #111;
    border-radius: 0 0 12px 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .sugg div { padding: 12px 14px; border-top: 1px solid #eee; font-size: 16px; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 16px; color: var(--text); }
  .check input { width: 22px; height: 22px; accent-color: var(--accent); }
  .row2 { display: flex; gap: 10px; align-items: center; margin-top: 14px; color: var(--muted); font-size: 15px; }
  .row2 input { width: 70px; font-size: 17px; padding: 10px; border-radius: 10px; border: 2px solid var(--line);
    background: var(--panel); color: var(--text); text-align: center; }
  .primary { width: 100%; margin-top: 26px; padding: 16px; font-size: 18px; font-weight: 800; border: 0;
    border-radius: 14px; background: var(--accent); color: var(--bg); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>

<!-- Abfahrtstafel -->
<section id="board" class="hidden">
  <header>
    <div class="clock" id="clock">--:--</div>
    <div class="btns">
      <button class="icon-btn" id="btnRefresh" aria-label="Aktualisieren">⟳</button>
      <button class="icon-btn" id="btnSettings" aria-label="Einstellungen">⚙</button>
    </div>
  </header>
  <div class="tabs">
    <button class="tab" data-dir="work">Zur Arbeit</button>
    <button class="tab" data-dir="home">Nach Hause</button>
  </div>
  <div class="route" id="route"></div>
  <div id="content"></div>
  <div class="status" id="status"></div>
</section>

<!-- Einstellungen -->
<section id="settings" class="hidden">
  <h2>Meine Haltestellen</h2>
  <label for="inHome">Zuhause (Haltestelle)</label>
  <div class="field"><input type="text" id="inHome" placeholder="z.B. Zürich, Bucheggplatz" autocomplete="off"><div class="sugg hidden"></div></div>
  <label for="inWork">Arbeit (Haltestelle)</label>
  <div class="field"><input type="text" id="inWork" placeholder="z.B. Zürich, Paradeplatz" autocomplete="off"><div class="sugg hidden"></div></div>

  <label class="check"><input type="checkbox" id="chkTram"> Nur Tram-Verbindungen</label>
  <label class="check"><input type="checkbox" id="chkDirect"> Nur direkte Verbindungen (ohne Umsteigen)</label>
  <div class="row2">Ab <input type="number" id="inSwitch" min="0" max="23"> Uhr automatisch „Nach Hause“ zeigen</div>
  <div class="row2">Fussweg zur Haltestelle: <input type="number" id="inWalk" min="0" max="30"> Min.</div>

  <button class="primary" id="btnSave">Speichern</button>
  <p class="hint">Fahrplandaten: transport.opendata.ch (Schweizer ÖV inkl. ZVV, mit Echtzeit-Verspätungen).<br>
  Mit Fussweg werden Verbindungen ausgeblendet, die du nicht mehr erreichst.</p>
</section>

<script>
(function () {
  "use strict";
  var API = "https://transport.opendata.ch/v1/";
  var KEY = "zvvTafel.settings.v1";
  var $ = function (id) { return document.getElementById(id); };

  // ---------- Netzwerk (nativ in der App, fetch im Browser) ----------
  var pending = {}, seq = 0;
  window.__netDone = function (id, ok, body) {
    var p = pending[id]; delete pending[id];
    if (!p) return;
    if (!ok) return p.reject(new Error(body || "Netzwerkfehler"));
    try { p.resolve(JSON.parse(body)); } catch (e) { p.reject(e); }
  };
  function getJSON(url) {
    if (window.AndroidNet) {
      return new Promise(function (resolve, reject) {
        var id = "r" + (++seq);
        pending[id] = { resolve: resolve, reject: reject };
        window.AndroidNet.get(id, url);
      });
    }
    return fetch(url).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }

  // ---------- Einstellungen ----------
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; }
  }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  var cfg = load();

  // ---------- Zustand ----------
  var dir = null, data = [], lastUpdate = null, loading = false, error = null;

  function autoDir() {
    var h = new Date().getHours();
    return h >= (cfg.switchHour != null ? cfg.switchHour : 13) || h < 3 ? "home" : "work";
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function shortName(n) { return String(n || "").replace(/^Zürich,\s*/, ""); }

  // ---------- Verbindungen laden ----------
  var open = {};   // aufgeklappte Verbindungen (Schlüssel -> true)

  function refresh() {
    if (!cfg || loading) return;
    var from = dir === "work" ? cfg.home : cfg.work;
    var to = dir === "work" ? cfg.work : cfg.home;
    var url = API + "connections?limit=6&from=" + encodeURIComponent(from) + "&to=" + encodeURIComponent(to);
    if (cfg.tramOnly) url += "&transportations[]=tram";
    if (cfg.direct) url += "&direct=1";
    loading = true; renderStatus();
    var forDir = dir;
    getJSON(url).then(function (j) {
      if (forDir !== dir) return;
      data = (j.connections || []).map(parseConn).filter(Boolean);
      error = null; lastUpdate = new Date();
    }).catch(function (e) {
      error = "Keine Verbindung zum Fahrplan – " + (e && e.message ? e.message : "Fehler");
    }).then(function () { loading = false; render(); });
  }

  var TRAIN = { S: 1, SN: 1, R: 1, RE: 1, IR: 1, IC: 1, ICE: 1, EC: 1, EN: 1, TGV: 1 };

  function parseTime(str) {
    if (!str) return null;
    var t = Date.parse(String(str).replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));
    return isNaN(t) ? null : new Date(t);
  }

  /** Zeitpunkt einer Haltestelle: Plan, Echtzeit, Verspätung, Kante (inkl. Gleisänderung) */
  function stopInfo(s, kind) {
    if (!s) return null;
    var ts = s[kind + "Timestamp"];
    var planned = ts ? new Date(ts * 1000) : parseTime(s[kind]);
    if (!planned) return null;
    var prog = s.prognosis || {};
    var real = parseTime(prog[kind]);
    var live = !!real || typeof s.delay === "number";
    if (!real) real = new Date(planned.getTime() + (typeof s.delay === "number" ? s.delay : 0) * 60000);
    var plat = s.platform || "", newPlat = prog.platform || "";
    return {
      planned: planned, real: real, live: live,
      delay: Math.round((real - planned) / 60000),
      platform: newPlat || plat, platformChanged: !!(newPlat && plat && newPlat !== plat),
      station: s.station && s.station.name ? s.station.name : ""
    };
  }

  function lineLabel(j, product) {
    var cat = j.category || "", n = String(j.number || "");
    if (n.length > 4 && product) return String(product).replace(/\s+/g, "");
    if (TRAIN[cat] && n.indexOf(cat) !== 0) return cat + n;
    return n || cat || "?";
  }

  function parseConn(c) {
    var dep = stopInfo(c.from, "departure");
    if (!dep) return null;
    var arr = stopInfo(c.to, "arrival");
    var legs = [], rideIdx = 0, cancelled = false;
    (c.sections || []).forEach(function (s) {
      if (s.journey) {
        var j = s.journey;
        if (j.cancelled) cancelled = true;
        legs.push({
          type: "ride", line: lineLabel(j, c.products && c.products[rideIdx]),
          train: !!TRAIN[j.category], towards: j.to || "",
          dep: stopInfo(s.departure, "departure"), arr: stopInfo(s.arrival, "arrival")
        });
        rideIdx++;
      } else if (s.walk || (s.departure && s.arrival)) {
        var a = s.departure && s.departure.departureTimestamp, b = s.arrival && s.arrival.arrivalTimestamp;
        var mins = a && b ? Math.round((b - a) / 60) : null;
        if (mins == null && s.walk && s.walk.duration != null) {
          var d = s.walk.duration;
          mins = typeof d === "number" ? (d > 100 ? Math.round(d / 60) : d)
               : (function (p) { return p.length === 3 ? (+p[0]) * 60 + (+p[1]) : +p[0]; })(String(d).split(":"));
        }
        legs.push({ type: "walk", minutes: mins || 0,
          from: s.departure && s.departure.station ? s.departure.station.name : "",
          to: s.arrival && s.arrival.station ? s.arrival.station.name : "" });
      }
    });
    var rides = legs.filter(function (l) { return l.type === "ride"; });
    // Fussweg zwischen zwei Fahrten der folgenden Fahrt zuordnen
    var walkBefore = 0;
    legs.forEach(function (l) {
      if (l.type === "walk") { walkBefore += l.minutes; }
      else { if (rides.indexOf(l) > 0) { l.walk = walkBefore; } walkBefore = 0; }
    });
    // Umsteigezeiten (mit Echtzeit, abzüglich Fussweg) berechnen
    var tight = false, missed = false;
    for (var i = 1; i < rides.length; i++) {
      var prev = rides[i - 1], next = rides[i], w = next.walk || 0;
      if (prev.arr && next.dep) {
        next.change = Math.round((next.dep.real - prev.arr.real) / 60000) - w;
        next.changePlanned = Math.round((next.dep.planned - prev.arr.planned) / 60000) - w;
        next.changeAt = prev.arr.station;
        next.changeTo = next.dep.station;
        if (next.change < 2) { next.tight = true; tight = true; }
        if (next.change < 0) missed = true;
      }
    }
    var first = rides[0] || { line: "?", towards: "" };
    return {
      key: dep.planned.getTime() + "|" + rides.map(function (r) { return r.line; }).join(">"),
      dep: dep, arr: arr, real: dep.real, legs: legs, rides: rides,
      line: first.line, train: first.train, towards: first.towards,
      transfers: Math.max(0, rides.length - 1), tight: tight, missed: missed, cancelled: cancelled
    };
  }

  // ---------- Darstellung ----------
  function minutesUntil(d) { return Math.floor((d.getTime() - Date.now()) / 60000); }

  function badge(l, small) {
    return '<span class="badge' + (l.train ? " train" : "") + (small ? " sm" : "") + '">' + esc(l.line) + "</span>";
  }
  function chain(c) {
    return c.rides.map(function (r) { return badge(r, true); }).join('<span class="chev">›</span>');
  }
  function delayTag(t) {
    if (!t) return "";
    if (t.delay > 0) return ' <span class="delay' + (t.delay >= 5 ? " big" : "") + '">+' + t.delay + "</span>";
    if (t.delay < 0) return ' <span class="ontime">' + t.delay + "</span>";
    return "";
  }
  function timeHtml(t) {
    if (!t) return "";
    if (t.delay !== 0) return '<s class="planned">' + hhmm(t.planned) + "</s> <b>" + hhmm(t.real) + "</b>" + delayTag(t);
    return "<b>" + hhmm(t.real) + "</b>";
  }
  function platHtml(t) {
    if (!t || !t.platform) return "";
    return t.platformChanged ? ' · <span class="delay">Kante ' + esc(t.platform) + " (geändert)</span>"
                             : " · Kante " + esc(t.platform);
  }
  function statusLine(c) {
    var parts = [];
    if (c.cancelled) parts.push('<span class="pill red">Fällt aus</span>');
    else if (c.dep.delay >= 5) parts.push('<span class="pill red">' + c.dep.delay + " Min. verspätet</span>");
    else if (c.dep.delay > 0) parts.push('<span class="pill orange">+' + c.dep.delay + " Min.</span>");
    else if (c.dep.live) parts.push('<span class="pill green">pünktlich</span>');
    if (c.tight) parts.push('<span class="pill red">' + (c.missed ? "Anschluss gefährdet" : "Anschluss knapp") + "</span>");
    if (c.arr && c.arr.delay > 0) parts.push('<span class="pill orange">Ankunft +' + c.arr.delay + "</span>");
    return parts.length ? '<div class="pills">' + parts.join("") + "</div>" : "";
  }

  function details(c) {
    var h = '<div class="legs">';
    c.legs.forEach(function (l, idx) {
      var between = idx > 0 && idx < c.legs.length - 1 && c.legs.slice(0, idx).some(function (x) { return x.type === "ride"; })
        && c.legs.slice(idx).some(function (x) { return x.type === "ride"; });
      if (l.type === "walk") {
        if (between) return;   // wird im Umsteige-Hinweis angezeigt
        if (l.minutes > 0) h += '<div class="change walk">🚶 ' + l.minutes + " Min. Fussweg" +
          (l.to ? " zu " + esc(shortName(l.to)) : "") + "</div>";
        return;
      }
      if (l.change != null) {
        var same = shortName(l.changeAt) === shortName(l.changeTo);
        h += '<div class="change' + (l.tight ? " bad" : "") + '">↻ Umsteigen in <b>' + esc(shortName(l.changeAt)) + "</b>" +
          (same ? "" : " → " + esc(shortName(l.changeTo))) + " · " +
          (l.walk ? "🚶 " + l.walk + " Min. Fussweg · " : "") +
          (l.change < 0 ? "Anschluss verpasst" : l.change + " Min. Reserve") +
          (l.change !== l.changePlanned ? " (geplant " + l.changePlanned + ")" : "") + "</div>";
      }
      h += '<div class="leg">' +
        '<div class="leghead">' + badge(l) + '<span class="dir">Richtung ' + esc(shortName(l.towards)) + "</span></div>" +
        '<div class="stop"><span class="dot"></span>' + timeHtml(l.dep) + " " + esc(shortName(l.dep && l.dep.station)) +
          '<span class="muted">' + platHtml(l.dep) + "</span></div>" +
        '<div class="stop"><span class="dot end"></span>' + timeHtml(l.arr) + " " + esc(shortName(l.arr && l.arr.station)) +
          '<span class="muted">' + platHtml(l.arr) + "</span></div></div>";
    });
    return h + "</div>";
  }

  function render() {
    if (!cfg) return;
    document.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("active", t.getAttribute("data-dir") === dir);
    });
    var from = dir === "work" ? cfg.home : cfg.work, to = dir === "work" ? cfg.work : cfg.home;
    $("route").innerHTML = "<b>" + esc(shortName(from)) + "</b> → <b>" + esc(shortName(to)) + "</b>";

    var walk = cfg.walk || 0;
    var list = data.filter(function (c) { return minutesUntil(c.real) >= walk; });
    var html = "";
    if (!list.length) {
      html = '<div class="msg">' + (error ? esc(error) : (loading ? "Lade Abfahrten…" : "Keine passenden Verbindungen gefunden.")) + "</div>";
    } else {
      var n = list[0], m = minutesUntil(n.real);
      html += '<div class="hero conn" data-key="' + esc(n.key) + '"><div class="top">' + chain(n) +
        '<div class="dest">Richtung ' + esc(shortName(n.towards)) + "</div></div>" +
        '<div class="mins">' + (n.cancelled ? "–" : (m <= 0 ? "jetzt" : m + "<small>Min.</small>")) + "</div>" +
        statusLine(n) +
        '<div class="meta">ab ' + timeHtml(n.dep) + platHtml(n.dep) +
        (n.arr ? " · an " + timeHtml(n.arr) : "") + "</div>" +
        '<div class="meta">' + (n.transfers ? n.transfers + "× umsteigen" : "direkt") +
        (walk ? " · Losgehen in " + Math.max(0, m - walk) + " Min." : "") + "</div>" +
        (open[n.key] ? details(n) : '<div class="more">Details anzeigen ▾</div>') + "</div>";
      if (list.length > 1) {
        html += '<div class="list">' + list.slice(1, 6).map(function (c) {
          var mm = minutesUntil(c.real);
          var warn = c.cancelled ? ' <span class="delay">fällt aus</span>' : (c.tight ? ' <span class="delay">' + (c.missed ? "Anschluss gefährdet" : "knapp") + "</span>" : "");
          return '<div class="row conn" data-key="' + esc(c.key) + '"><div class="rowmain">' +
            '<div class="chain">' + chain(c) + "</div>" +
            '<div class="info">' + timeHtml(c.dep) + (c.arr ? " → " + hhmm(c.arr.real) + delayTag(c.arr) : "") +
            (c.transfers ? " · " + c.transfers + "×" : "") + warn + "</div>" +
            '<div class="in">' + mm + "<small> Min.</small></div></div>" +
            (open[c.key] ? details(c) : "") + "</div>";
        }).join("") + "</div>";
      }
    }
    $("content").innerHTML = html;
    renderStatus();
  }
  function renderStatus() {
    $("status").textContent = loading ? "Aktualisiere…" :
      (lastUpdate ? "Stand " + hhmm(lastUpdate) + " · Verbindung antippen für Details" : "");
  }

  // ---------- Ansichten ----------
  function showBoard() {
    $("settings").classList.add("hidden"); $("board").classList.remove("hidden");
    if (!dir) dir = autoDir();
    data = []; render(); refresh();
  }
  function showSettings() {
    var c = cfg || {};
    $("inHome").value = c.home || ""; $("inWork").value = c.work || "";
    $("chkTram").checked = !!c.tramOnly; $("chkDirect").checked = !!c.direct;
    $("inSwitch").value = c.switchHour != null ? c.switchHour : 13;
    $("inWalk").value = c.walk || 0;
    $("board").classList.add("hidden"); $("settings").classList.remove("hidden");
  }

  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () {
      dir = t.getAttribute("data-dir"); data = []; error = null; render(); refresh();
    });
  });
  $("btnSettings").addEventListener("click", showSettings);
  $("btnRefresh").addEventListener("click", refresh);
  $("status").addEventListener("click", refresh);
  $("content").addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest(".conn") : null;
    if (!el) { refresh(); return; }
    var k = el.getAttribute("data-key");
    if (open[k]) delete open[k]; else open[k] = true;
    render();
  });
  $("btnSave").addEventListener("click", function () {
    var home = $("inHome").value.trim(), work = $("inWork").value.trim();
    if (!home || !work) { alertBox("Bitte beide Haltestellen eingeben."); return; }
    cfg = {
      home: home, work: work, tramOnly: $("chkTram").checked, direct: $("chkDirect").checked,
      switchHour: Math.min(23, Math.max(0, parseInt($("inSwitch").value, 10) || 13)),
      walk: Math.min(30, Math.max(0, parseInt($("inWalk").value, 10) || 0))
    };
    save(cfg); dir = autoDir(); showBoard();
  });
  function alertBox(t) { var h = document.querySelector(".hint"); h.textContent = t; h.style.color = "#FF5A5A"; }

  // Haltestellen-Vorschläge
  document.querySelectorAll(".field").forEach(function (f) {
    var input = f.querySelector("input"), box = f.querySelector(".sugg"), timer = null;
    input.addEventListener("input", function () {
      clearTimeout(timer);
      var q = input.value.trim();
      if (q.length < 2) { box.classList.add("hidden"); return; }
      timer = setTimeout(function () {
        getJSON(API + "locations?type=station&query=" + encodeURIComponent(q)).then(function (j) {
          var st = (j.stations || []).filter(function (s) { return s.name; }).slice(0, 6);
          box.innerHTML = st.map(function (s) { return "<div>" + esc(s.name) + "</div>"; }).join("");
          box.classList.toggle("hidden", !st.length);
          box.querySelectorAll("div").forEach(function (d) {
            d.addEventListener("click", function () { input.value = d.textContent; box.classList.add("hidden"); });
          });
        }).catch(function () {});
      }, 300);
    });
    input.addEventListener("blur", function () { setTimeout(function () { box.classList.add("hidden"); }, 200); });
  });

  // Hooks für die Android-App
  window.onAppResume = function () {
    if (cfg && !$("board").classList.contains("hidden")) { dir = autoDir(); data = []; render(); refresh(); }
  };
  window.onBack = function () {
    if (cfg && !$("settings").classList.contains("hidden")) { showBoard(); return true; }
    return false;
  };

  // Uhr & Timer
  setInterval(function () {
    $("clock").textContent = hhmm(new Date());
    if (cfg && !$("board").classList.contains("hidden")) render();
  }, 10000);
  setInterval(refresh, 30000);
  $("clock").textContent = hhmm(new Date());

  if (cfg) showBoard(); else showSettings();
})();
</script>
</body>
</html>
