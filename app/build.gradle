plugins { id 'com.android.application' }

android {
    namespace 'ch.zvv.tafel'
    compileSdk 35
    defaultConfig {
        applicationId 'ch.zvv.tafel'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        fest {
            storeFile file('meintram.keystore')
            storePassword 'meintram'
            keyAlias 'meintram'
            keyPassword 'meintram'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fest }
        release { minifyEnabled false; signingConfig signingConfigs.fest }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
